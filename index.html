<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="報告リマインダー">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-180.png">

  <title>報告リマインダー PWAテスト</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f2f4f8;
      color: #172033;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px #0001;
    }

    h1 { font-size: 24px; }

    button {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      background: #2457d6;
      color: white;
    }

    #status {
      padding: 12px;
      border-radius: 10px;
      background: #eef2ff;
    }
  </style>

  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "e27a9e87-124d-47a6-bf14-4f0933a990d3",
        serviceWorkerPath: "/report-reminder-pwa/OneSignalSDKWorker.js",
        serviceWorkerParam: {
          scope: "/report-reminder-pwa/"
        }
      });
    });
  </script>
</head>

<body>
  <main>
    <div class="card">
      <h1>報告リマインダー</h1>
      <p>これはPWAの表示・通知テストです。</p>

      <p id="status">OneSignalの準備中です…</p>

      <button id="testButton">テストボタン</button>
      <p id="result"></p>

      <button id="notifyButton">通知を許可する</button>
      <p id="notifyStatus"></p>
    </div>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./OneSignalSDKWorker.js", {
        scope: "./"
      })
      .then(() => {
        document.getElementById("status").textContent =
          "Service Worker 登録済み";
      })
      .catch(error => {
        document.getElementById("status").textContent =
          "Service Worker 登録失敗: " + error;
      });
    }

    document.getElementById("testButton").addEventListener("click", () => {
      document.getElementById("result").textContent =
        "ボタンが動作しました！";
    });

    document.getElementById("notifyButton").addEventListener("click", async () => {
      document.getElementById("notifyStatus").textContent =
        "OneSignalに登録しています…";
    
      try {
        await OneSignal.User.PushSubscription.optIn();
    
        document.getElementById("notifyStatus").textContent =
          "OneSignalへの登録処理が完了しました！";
    
        document.getElementById("status").textContent =
          "購読ID: " + (OneSignal.User.PushSubscription.id || "登録処理中");
      } catch (error) {
        document.getElementById("notifyStatus").textContent =
          "登録エラー: " + error;
      }
    });
  </script>
</body>
</html>
