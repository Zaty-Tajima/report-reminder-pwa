<!doctype html>

<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172033">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="報告リマインダー">


  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-180.png">


  <title>報告リマインダー PWAテスト v0.1.5</title>


  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f2f4f8;
      color: #172033;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px #0001;
    }

    h1 {
      font-size: 24px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      background: #2457d6;
      color: white;
    }

    button:disabled {
      background: #999;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #eef2ff;
      overflow-wrap: anywhere;
    }

    .small {
      font-size: 13px;
      color: #555;
      overflow-wrap: anywhere;
    }
  </style>


  <!-- OneSignal SDK -->


  <script
    src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
    defer>
  </script>


  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    window.oneSignalInstance = null;

    window.OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "e27a9e87-124d-47a6-bf14-4f0933a990d3",
          serviceWorkerPath: "/report-reminder-pwa/OneSignalSDKWorker.js",
          serviceWorkerParam: {
            scope: "/report-reminder-pwa/"
          }
        });

        window.oneSignalInstance = OneSignal;

        document.getElementById("sdkStatus").textContent =
          "OneSignal SDK 初期化完了";

        document.getElementById("notifyButton").disabled = false;

        // 購読状態が変わった際に画面を更新
        OneSignal.User.PushSubscription.addEventListener("change", function(event) {
          const subscription = OneSignal.User.PushSubscription;

          document.getElementById("subscriptionStatus").textContent =
            "購読状態: " + subscription.optedIn;

          document.getElementById("subscriptionId").textContent =
            "購読ID: " + (subscription.id || "未発行");
        });

        updateSubscriptionStatus(OneSignal);

      } catch (error) {
        document.getElementById("sdkStatus").textContent =
          "OneSignal初期化エラー: " + error.message;

        console.error("OneSignal init error:", error);
      }
    });

    function updateSubscriptionStatus(OneSignal) {
      const subscription = OneSignal.User.PushSubscription;

      document.getElementById("subscriptionStatus").textContent =
        "購読状態: " + subscription.optedIn;

      document.getElementById("subscriptionId").textContent =
        "購読ID: " + (subscription.id || "未発行");
    }
  </script>


</head>


<body>
  <main>
    <div class="card">
      <h1>報告リマインダー v0.1.5</h1>


<p>OneSignal通知テスト用のページです。</p>

<p id="sdkStatus" class="status">
OneSignal SDKを初期化しています…
</p>

<button id="testButton">
テストボタン
</button>

<p id="result"></p>

<button id="notifyButton" disabled>
通知を許可・購読登録する
</button>

<p id="notifyStatus" class="status">
まだ登録処理を行っていません。
</p>

<p id="subscriptionStatus" class="small">
購読状態: 確認中
</p>

<p id="subscriptionId" class="small">
購読ID: 確認中
</p>

<p id="browserPermission" class="small">
ブラウザ通知許可: 確認中
</p>
</div>

  </main>


  <script>
    // ブラウザ通知許可の状態を表示
    function updateBrowserPermission() {
      if ("Notification" in window) {
        document.getElementById("browserPermission").textContent =
          "ブラウザ通知許可: " + Notification.permission;
      } else {
        document.getElementById("browserPermission").textContent =
          "この環境は通知に対応していません";
      }
    }

    updateBrowserPermission();

    // 通常のテストボタン
    document.getElementById("testButton").addEventListener("click", function() {
      document.getElementById("result").textContent =
        "テストボタンが動作しました！";
    });

    // OneSignal通知許可・購読登録
    document.getElementById("notifyButton").addEventListener("click", async function() {
      const notifyStatus = document.getElementById("notifyStatus");
      const button = document.getElementById("notifyButton");

      const OneSignal = window.oneSignalInstance;

      if (!OneSignal) {
        notifyStatus.textContent =
          "OneSignal SDKがまだ準備できていません。少し待ってから再度押してください。";
        return;
      }

      button.disabled = true;
      notifyStatus.textContent = "通知許可を確認しています…";

      try {
        // OneSignal SDKから通知許可をリクエスト
        await OneSignal.Notifications.requestPermission();

        updateBrowserPermission();

        if (Notification.permission !== "granted") {
          notifyStatus.textContent =
            "通知が許可されていません。iPhoneの設定を確認してください。";
          return;
        }

        notifyStatus.textContent =
          "OneSignalに購読登録しています…";

        // OneSignalのPush購読登録
        await OneSignal.User.PushSubscription.optIn();

        notifyStatus.textContent =
          "購読登録処理を実行しました。IDの発行を確認しています…";

        updateSubscriptionStatus(OneSignal);

      } catch (error) {
        notifyStatus.textContent =
          "登録エラー: " + (error.message || error);

        console.error("OneSignal subscription error:", error);

      } finally {
        button.disabled = false;
      }
    });

    function updateSubscriptionStatus(OneSignal) {
      const subscription = OneSignal.User.PushSubscription;

      document.getElementById("subscriptionStatus").textContent =
        "購読状態: " + subscription.optedIn;

      document.getElementById("subscriptionId").textContent =
        "購読ID: " + (subscription.id || "未発行");
    }
  </script>


</body>
</html>
